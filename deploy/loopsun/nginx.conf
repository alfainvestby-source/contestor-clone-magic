# Static server for loopsun (Vite build in /usr/share/nginx/html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

    # .htaccess is only for Apache hosting; never serve dotfiles.
    location ~ /\. {
        deny all;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }

    # Old WordPress URLs and any unknown path fall back to the landing page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
