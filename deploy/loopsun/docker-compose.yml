# Loopsun (static Vite build served by nginx).
# Routed by the Traefik in /docker/n8n alongside pilotic, majengo and the other sites.
services:
  loopsun:
    image: nginx:1.27-alpine
    container_name: loopsun
    restart: unless-stopped
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      # loopsun.com is canonical; www.loopsun.com only redirects. Separate routers
      # so each host gets its own certificate (one failing ACME can't block the other).
      - traefik.http.routers.loopsun.entrypoints=websecure
      - traefik.http.routers.loopsun.rule=Host(`loopsun.com`)
      - traefik.http.routers.loopsun.tls=true
      - traefik.http.routers.loopsun.tls.certresolver=mytlschallenge
      - traefik.http.routers.loopsun-www.entrypoints=websecure
      - traefik.http.routers.loopsun-www.rule=Host(`www.loopsun.com`)
      - traefik.http.routers.loopsun-www.tls=true
      - traefik.http.routers.loopsun-www.tls.certresolver=mytlschallenge
      - traefik.http.routers.loopsun-www.service=loopsun
      - traefik.http.routers.loopsun-www.middlewares=loopsun-apex
      - traefik.http.middlewares.loopsun-apex.redirectregex.regex=^https?://www\.loopsun\.com/(.*)
      - traefik.http.middlewares.loopsun-apex.redirectregex.replacement=https://loopsun.com/$${1}
      - traefik.http.middlewares.loopsun-apex.redirectregex.permanent=true
      - traefik.http.services.loopsun.loadbalancer.server.port=80
networks:
  n8n_default:
    external: true
